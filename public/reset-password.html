<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Post Forwarder</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="account-action-page">
  <main class="account-action-card">
    <a class="landing-brand" href="/"><span class="landing-brand-mark" aria-hidden="true">➤</span><span>Post Forwarder</span></a>
    <div class="action-symbol" aria-hidden="true">⌑</div>
    <h1>Choose a new password</h1>
    <p class="muted" id="reset-message">Use at least 8 characters. Your reset link can only be used once.</p>
    <form id="reset-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
      <div id="reset-error" class="auth-error hidden" role="alert"></div>
      <button class="btn auth-submit" id="reset-button" type="submit">Reset password</button>
    </form>
    <a class="action-back" href="/">Back to login</a>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
