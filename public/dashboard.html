<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Post Forwarder</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">➤</span>
        <span><strong>Post Forwarder</strong><small>Telegram automation</small></span>
      </div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" id="nav" aria-label="Main navigation">
        <button data-tab="overview" class="active" type="button"><span class="nav-icon" aria-hidden="true">◫</span>Overview</button>
        <button data-tab="channels" type="button"><span class="nav-icon" aria-hidden="true">▣</span>Channels</button>
        <button data-tab="promotions" type="button"><span class="nav-icon" aria-hidden="true">✦</span>Promotions</button>
        <button data-tab="logs" type="button"><span class="nav-icon" aria-hidden="true">◷</span>Activity logs</button>
        <button data-tab="settings" type="button"><span class="nav-icon" aria-hidden="true">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-footer">
        <strong>Telegram post automation</strong>
        <span>Manage your forwarding workspace</span>
      </div>
    </aside>
    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close navigation"></button>

    <div class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Open navigation">☰</button>
        <div class="topbar-title">
          <strong id="topbar-title">Workspace</strong>
          <span id="topbar-subtitle">Manage your Telegram forwarding</span>
        </div>
        <div class="user">
          <span class="user-avatar" id="user-avatar" aria-hidden="true"></span>
          <span class="muted" id="who"></span>
          <button class="btn ghost small" id="logout" type="button">Log out</button>
        </div>
      </header>

      <main class="container">
        <section class="page-heading">
          <h1 id="page-title">Overview</h1>
          <p id="page-subtitle">Track your channels and forwarding activity from one place.</p>
        </section>
        <section id="view" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <dialog id="dlg">
    <form id="dlg-form" method="dialog"></form>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
