<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email — Post Forwarder</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="account-action-page">
  <main class="account-action-card">
    <a class="landing-brand" href="/"><span class="landing-brand-mark" aria-hidden="true">➤</span><span>Post Forwarder</span></a>
    <div class="action-symbol" aria-hidden="true">✉</div>
    <h1>Verify your email</h1>
    <p class="muted" id="action-message">Confirm this email address to activate your account.</p>
    <div id="action-error" class="auth-error hidden" role="alert"></div>
    <button class="btn auth-submit" id="verify-button" type="button">Verify email address</button>
    <a class="action-back" href="/">Back to login</a>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/verify-email.js"></script>
</body>
</html>
